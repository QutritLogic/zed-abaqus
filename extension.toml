id = "abaqus"
name = "Abaqus"
version = "0.1.0"
schema_version = 1
authors = ["QutritLogic"]
description = "Abaqus input files (.inp, .inc, .incl): syntax highlighting, outline, text objects and snippets."

snippets = ["./snippets/abaqus.json"]

# The grammar lives in tree-sitter-abaqus/ inside this repository. Zed builds
# it from the commit given in rev, so rev must be a pushed commit that
# contains the current grammar. When working on the grammar locally,
# install.sh points this at your clone instead; don't commit that change.
[grammars.abaqus]
repository = "https://github.com/QutritLogic/zed-abaqus"
rev = "5539cc283fc5a665c76f6c1c5597b619398735a9"
path = "tree-sitter-abaqus"
